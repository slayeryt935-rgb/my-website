<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jervis Tech</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>

html {
  scroll-behavior: smooth;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial;
}

body {
  background: radial-gradient(circle at top, #1e3a8a, #020617);
  color: white;
  overflow-x: hidden;
}

/* NAVBAR */
header {
  display: flex;
  justify-content: space-between;
  padding: 20px 50px;
  position: fixed;
  width: 100%;
  backdrop-filter: blur(10px);
  background: rgba(15, 23, 42, 0.5);
  z-index: 1000;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #38bdf8;
}

nav a {
  margin-left: 20px;
  text-decoration: none;
  color: white;
  transition: 0.3s;
}

nav a:hover {
  color: #38bdf8;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
}

.hero::before {
  content: "";
  position: absolute;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, #38bdf8, transparent);
  filter: blur(120px);
  z-index: -1;
}

.hero h1 {
  font-size: 50px;
}

.hero p {
  margin-top: 20px;
}

/* BUTTON */
.btn {
  margin-top: 20px;
  padding: 12px 25px;
  background: linear-gradient(45deg, #38bdf8, #6366f1);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  color: white;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px #38bdf8;
}

/* SECTION */
.section {
  padding: 120px 20px;
  text-align: center;
}

/* CARDS */
.cards {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 30px;
}

.card {
  background: rgba(30, 41, 59, 0.5);
  padding: 25px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
  transition: 0.4s;
}

.card:hover {
  transform: translateY(-10px) scale(1.05);
  box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
}

/* FOOTER */
footer {
  padding: 20px;
  text-align: center;
  background: #020617;
}

</style>
</head>

<body>

<header>
  <div class="logo">Jervis</div>
  <nav>
    <a href="#hero">Home</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero" id="hero">
  <div class="hero-content">
    <h1 class="hero-text">Future of Digital Business</h1>
    <p>Modern, Fast, Innovative</p>
    <button class="btn" onclick="document.querySelector('#services').scrollIntoView()">Get Started</button>
  </div>
</section>

<!-- SERVICES -->
<section class="section" id="services">
  <h2>Our Services</h2>
  <div class="cards">
    <div class="card">Web Development</div>
    <div class="card">AI Solutions</div>
    <div class="card">Marketing</div>
  </div>
</section>

<!-- CONTACT -->
<section class="section" id="contact">
  <h2>Contact Us</h2>
  <p>Email: contact@jervis.com</p>
</section>

<footer>
  <p>© 2026 Jervis. All rights reserved.</p>
</footer>

<!-- ANIMATIONS -->
<script>

gsap.registerPlugin(ScrollTrigger);

// Hero animation
gsap.from(".hero-text", {
  opacity: 0,
  y: 100,
  duration: 1.2
});

// Cards animation
gsap.from(".card", {
  opacity: 0,
  y: 80,
  stagger: 0.3,
  scrollTrigger: {
    trigger: "#services",
    start: "top 80%"
  }
});

// Navbar fade
gsap.from("header", {
  y: -80,
  opacity: 0,
  duration: 1
});

</script>

</body>
</html>
